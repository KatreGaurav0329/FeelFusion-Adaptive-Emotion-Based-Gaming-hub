<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>FeelFusion - Emotion Based Game</title>
  
  <!-- FONT IMPORTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- STYLESHEET -->
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <body>
  <div class="animated-background">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>

  </div>
  </body>

  <!-- Main container for your page content -->
  <div class="container">
      
      <!-- Video and emotion UI -->
      <div class="video-container">
        <video id="video" autoplay muted></video>
      </div>
      <div class="emotion-display">
        <div class="emotion-label" id="emotionLabel">No face detected</div>
        <div class="confidence-score" id="confidenceScore">---</div>
      </div>

      <!-- Whack-a-Mole Game Content -->
      <div class="main-content">
        <h2 class="game-title">Whack-a-Mole! <span class="score"> 0 </span></h2>
        <div class="speed-display">
          Speed: <span id="speedValue">–</span> ms
        </div>
        
        <div class="controls">
          <select id="mode" hidden>
            <option value="super-easy">Super Easy</option>
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="super-hard">Super Hard</option>
          </select>
          <button  onclick="window.location.href='../../index.html'">🏠 Home</button>
          <button id="startBtn">Start</button>
          <button id="endBtn" disabled>End</button>
        </div>
        
        <div class="game">
          <div class="hole hole1"><div class="mole"></div></div>
          <div class="hole hole2"><div class="mole"></div></div>
          <div class="hole hole3"><div class="mole"></div></div>
          <div class="hole hole4"><div class="mole"></div></div>
          <div class="hole hole5"><div class="mole"></div></div>
          <div class="hole hole6"><div class="mole"></div></div>
        </div>
      </div>
  </div>

  

  <!-- JAVASCRIPT FILES -->
  <script src="../face-api.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
