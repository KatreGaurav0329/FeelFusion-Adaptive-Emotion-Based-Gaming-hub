<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script defer src="../face-api.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body>
    <div class="video-container">
        <video id="video" width="320" height="240" autoplay muted></video>
    </div>

    <div class="emotion-display">
        <div class="emotion-label" id="emotionLabel">Loading AI...</div>
        <div class="confidence-score" id="confidenceScore">---</div>
    </div>

    <div id="expression-popup" class="expression-popup"></div>

    <div class="game-container">
        <h1>MEMORY MATRIX</h1>

        <div class="difficulty-selector" hidden>
            <label>Difficulty:</label>
            <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>

        <div class="score-board">
            <button class="home" onclick="window.location.href='../../index.html'">🏠 Home</button>
            <div class="stat-box">TIME <span id="timer">00:00</span></div>
            <div class="stat-box">SCORE <span id="score">0</span></div>
            <div class="stat-box">MOVES <span id="moves">0</span></div>
        </div>

        <div class="memory-game" id="game-board">
        </div>

        <div class="controls">
            <button id="restart-btn" onclick="restartGame()">RESTART</button>
            <button id="pause-btn" onclick="togglePause()">PAUSE</button>
        </div>
    </div>
</body>

</html>
