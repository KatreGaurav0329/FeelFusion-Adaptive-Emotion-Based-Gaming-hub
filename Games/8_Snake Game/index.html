<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive Snake game that changes difficulty based on your facial expression, powered by face-api.js.">
    <title>FeelFusion 🐍 Snake Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script defer src="../face-api.min.js"></script>
    <script defer src="script.js"></script>

    
</head>

<body>




    <div class="ui-overlays">
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div class="emotion-display">
            <div class="emotion-label" id="emotionLabel">Loading...</div>
            <div class="confidence-score" id="confidenceScore">---</div>
        </div>
        <div id="diff-display" class="difficulty-display">
            <strong>Emotion:</strong> --- <br />
            <strong>Speed:</strong> -- ms/frame<br />
            <strong>Fruit Score:</strong> --
        </div>
    </div>


    <main class="main-content">
        <div id="startScreen">
            <h2 class="game-title">🐍 SNAKE</h2>
            <div class="mode-selection">
                <h3>Start Game</h3>
                <button data-mode="super_easy">Play Game</button><br><br>
                <button  onclick="window.location.href='../../index.html'">🏠 Home</button>
            </div>
        </div>

        <div id="mainGameUI" class="hidden">
            <div class="score-container">
                <span>Score: <span id="score">0</span></span>
                <span >High Score: <span id="high-score">0</span></span>
                <button class="home" onclick="window.location.href='../../index.html'">🏠 Home</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                <div id="gameOverScreen" class="hidden">
                    <h2>Game Over</h2>
                    <p>Press 'Enter' to return to the menu</p>
                </div>
            </div>
        </div>
    </main>

    

</body>

</html>
